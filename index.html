<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263B65">
<title>Estoque UROtherap</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estoque">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar fixa + área de trabalho em cards; no celular vira barra inferior */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#FAF8F4; --line:#E9E4DA; --ink:#1F2A44; --muted:#6F7688;
  --accent:#263B65; --accent-2:#1E3055; --accent-soft:#E9EDF5; --gold:#C1982F; --gold-2:#8C6B16; --gold-soft:#F8F1DE;
  --ok:#1E9A69; --ok-soft:#E4F5EC; --warn:#B9770E; --warn-soft:#FDF2DE; --crit:#D2463F; --crit-soft:#FCE8E6;
  --violet:#7259C4; --violet-soft:#EEEAFA; --blue:#2C77CC; --blue-soft:#E5EFFB;
  --navy:#263B65;
  --font:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px; --r-sm:10px; --shadow:0 1px 2px rgba(38,59,101,.04), 0 6px 20px rgba(38,59,101,.05);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#34508A,var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(38,59,101,.25)}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand-img{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 6px 0}
.brand-img img{width:100%;max-width:178px;height:auto;display:block}
.brand-img small{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600;text-transform:uppercase}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.login-logo img{width:min(230px,70%);height:auto;display:block}
.login-logo small{font-size:11.5px;letter-spacing:.14em;color:var(--muted);font-weight:600;text-transform:uppercase;padding-bottom:14px}
.mlogo{display:none;width:34px;height:34px;flex:none}
.clinic{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.clinic .ci{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center}
.clinic b{display:block;font-size:13px}.clinic small{color:var(--muted);font-size:11.5px}
.navlbl{font-size:11px;letter-spacing:.12em;color:#9A9484;font-weight:600;padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#3F4A63;text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .badge{margin-left:auto;background:var(--crit-soft);color:var(--crit);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.duty{background:radial-gradient(120% 120% at 100% 0%,#3A5488 0%,var(--navy) 60%);color:#fff;border-radius:14px;padding:14px}
.duty small{color:#E3CF97;font-size:11.5px}
.duty .av-row{display:flex;margin:10px 0 8px}
.duty .av-row .av{margin-left:-6px;border:2px solid var(--navy)}.duty .av-row .av:first-child{margin-left:0}
.duty b{font-size:13px}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px}
.me b{display:block;font-size:13px}.me small{color:var(--muted);font-size:11.5px}
.me button{margin-left:auto}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--muted);position:relative}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%;color:var(--ink)}
.search kbd{font:600 11px var(--font);background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.sresults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:20;max-height:360px;overflow:auto}
.sresults button{display:flex;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;gap:10px;align-items:center}
.sresults button:hover{background:var(--surface-2)}
.top .sp{flex:1}
.when{display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}.when b{color:var(--ink)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative;color:#3D5260}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:99px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:linear-gradient(135deg,#34508A,var(--accent));color:#fff;border:0;box-shadow:0 3px 10px rgba(38,59,101,.22)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.content{padding:26px 28px 40px;display:flex;flex-direction:column;gap:20px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;font-size:13px}
.banner.demo{background:var(--blue-soft);color:#1F5A9E}
.banner.off{background:var(--warn-soft);color:#8A5A08}
.banner.warn{background:var(--warn-soft);color:#8A5A08}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:24px;letter-spacing:-.015em}
.head p{margin:4px 0 0;color:var(--muted)}
.head .sp{flex:1}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.card-h h2{font-size:15px}
.card-h .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-violet{background:var(--violet-soft);color:var(--violet)}.p-blue{background:var(--blue-soft);color:var(--blue)}.p-mute{background:#EEF2F4;color:#5D707C}.p-acc{background:var(--accent-soft);color:var(--accent-2)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi:hover{border-color:#D9D1BF}
.kpi .kh{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.kpi .kic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.kpi .kv{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kpi .kv small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .ks{color:var(--muted);font-size:12px}
.grid-home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.tl{padding:4px 18px 16px;display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.tl-row:first-child{border-top:0}
.tl-t{color:var(--muted);font-size:12px}
.chip{border-left:3px solid;border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;min-width:0}
.chip b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font-size:12px;opacity:.85}
.c-entrada{background:var(--ok-soft);border-color:var(--ok);color:#16583F}
.c-saida{background:var(--blue-soft);border-color:var(--blue);color:#1D4E86}
.c-ajuste{background:var(--violet-soft);border-color:var(--violet);color:#4B3A87}
.c-descarte{background:var(--crit-soft);border-color:var(--crit);color:#8C2E2A}
.qty{font-weight:700;font-size:13px;text-align:right;white-space:nowrap}
.q-pos{color:var(--ok)}.q-neg{color:var(--blue)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.hero{margin:4px 14px 10px;border-radius:14px;padding:16px;color:#fff;background:radial-gradient(90% 120% at 100% 100%,rgba(255,255,255,.18),transparent 60%),linear-gradient(140deg,#34508A,#1E3055);position:relative;overflow:hidden;cursor:pointer}
.hero.crit{background:radial-gradient(90% 120% at 100% 100%,rgba(255,255,255,.16),transparent 60%),linear-gradient(140deg,#E0625A,#A8322C)}
.hero small{opacity:.85;font-size:12px}
.hero .hv{font-size:22px;font-weight:700;margin:6px 0 2px;letter-spacing:-.01em}
.hero .hs{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.hero .tag{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.al{display:flex;flex-direction:column;padding:0 14px 12px}
.al-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit}
.al-row:hover{background:var(--surface-2)}
.al-row b{display:block;font-size:13px}.al-row small{color:var(--muted);font-size:12px}
.al-code{font-size:11px;font-weight:700;width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.al-r{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}.al-r b{font-size:13px}
.bars{padding:4px 18px 18px;display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:180px 1fr 110px;gap:12px;align-items:center;font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#D4AF4E,var(--gold));border-radius:99px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

/* ---------- Tabelas e filtros ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.toolbar .search{max-width:none;flex:1;min-width:200px}
.field,select.field{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;min-width:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8C8676;font-weight:600;text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--accent)}th.sortable.on{color:var(--accent);background:var(--accent-soft)}
th .arr{margin-left:5px;font-size:10px;opacity:.45}th.on .arr{opacity:1;color:var(--gold-2)}
tr.click{cursor:pointer}tr.click:hover td{background:#FBF9F4}
td .sub{display:block;color:var(--muted);font-size:12px;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.r,th.r{text-align:right}
.level{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.level .bar{width:70px;height:6px}
.level .bar i.low{background:var(--crit)}.level .bar i.mid{background:#E0A53A}
.groups{display:flex;flex-direction:column;gap:16px}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pad{padding:4px 18px 18px}
.pad p{margin:0 0 12px;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:rgba(31,42,68,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:18px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 20px 60px rgba(31,42,68,.25)}
.modal.wide{width:min(860px,100%)}
.ov.drawer{justify-content:flex-end;padding:0}
.ov.drawer .modal{height:100%;max-height:none;border-radius:18px 0 0 18px;width:min(640px,100%)}
.m-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 8px;position:sticky;top:0;background:#fff;z-index:2}
.m-h h2{font-size:18px}.m-h p{margin:3px 0 0;color:var(--muted);font-size:13px}
.m-h .sp{flex:1}
.m-b{padding:10px 22px 8px;display:flex;flex-direction:column;gap:14px}
.m-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 20px;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;cursor:pointer;color:#4A5470}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(38,59,101,.1);color:var(--ink)}
.seg button.on[data-v="entrada"]{color:var(--ok)}.seg button.on[data-v="saida"]{color:var(--blue)}.seg button.on[data-v="ajuste"]{color:var(--violet)}.seg button.on[data-v="descarte"]{color:var(--crit)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:#4A5470}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:400;background:#fff;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.picked{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.picked b{display:block}.picked small{color:var(--muted)}
.picked .sp{flex:1}
.plist{border:1px solid var(--line);border-radius:12px;max-height:260px;overflow:auto}
.plist button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:10px 12px;cursor:pointer}
.plist button:last-child{border-bottom:0}.plist button:hover{background:var(--surface-2)}
.plist .sp{flex:1}
.lots{display:flex;flex-direction:column;gap:6px}
.lot{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:#fff;text-align:left}
.lot.on{border-color:var(--accent);background:var(--accent-soft)}
.lot input{accent-color:var(--accent)}
.lot small{color:var(--muted)}
.note{border-radius:10px;padding:9px 12px;font-size:13px}
.note.warn{background:var(--warn-soft);color:#8A5A08}.note.crit{background:var(--crit-soft);color:#8C2E2A}.note.info{background:var(--accent-soft);color:var(--accent-2)}
.err{color:var(--crit);font-size:13px;font-weight:600}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dl div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dl small{display:block;color:var(--muted);font-size:11.5px}.dl b{font-size:13.5px;word-break:break-word}
.nfls{display:flex;flex-direction:column;gap:10px}
.nfl{border:1px solid var(--line);border-radius:12px;background:#fff}
.nfl.off{opacity:.55;background:var(--surface-2)}
.nfl-h{display:flex;gap:10px;align-items:center;padding:10px 12px;flex-wrap:wrap}
.nfl-h b{display:block;font-size:13.5px}.nfl-h small{color:var(--muted);font-size:12px}
.nfl-b{display:flex;flex-direction:column;gap:10px;padding:2px 12px 12px;border-top:1px dashed var(--line);padding-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px}
.chipbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:#4A5470}
.chipbtn:hover{border-color:var(--gold);background:var(--gold-soft)}
.chipbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- Login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 50% at 80% 0%,#F3E8C8,transparent),var(--bg)}
.lcard{width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:18px}
.lcard h1{font-size:22px}
.ulist{display:flex;flex-direction:column;gap:8px}
.ubtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left}
.ubtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.ubtn small{color:var(--muted);display:block;font-size:12px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid #CFC7B4}
.pin-dots i.f{background:var(--accent);border-color:var(--accent)}
.pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad-grid button{height:56px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:600;cursor:pointer}
.pad-grid button:active{background:var(--accent-soft)}
.pad-grid button.ghost{border:0;background:none;font-size:14px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(31,42,68,.3);z-index:80;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast.bad{background:#8C2E2A}
.mobnav,.fab{display:none}
.iconbtn.show-m{display:none}
.code{display:inline-block;font:600 10.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--gold-soft);color:var(--gold-2);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px;letter-spacing:.02em;white-space:nowrap}
tr.grp td{background:var(--surface-2)}

async function carregar(silencioso){

    if(ONLINE) store.set("estoque_cache", { em: S.carregadoEm, ...d });
  } catch(e){

    else if(!silencioso) { S.erroCarga = e.message || "Falha de conexão"; }
  }

  derivar();
}
const pacDe = m => m.paciente || S.pac[m.id] || "";
async function carregarPrivado(){
  const tenta = async f => { try { return await f(); } catch(e){ return null; } };
  const [pac, procs, us, custos] = await Promise.all([tenta(() => API.pacientes()), tenta(() => API.procs()), tenta(() => API.usuarios()), isAdmin() ? tenta(() => API.custos()) : null]);
  if(pac) S.pac = pac; if(procs) S.procs = procs; if(us) S.usuarios = us;
  if(custos && ONLINE) S.itens = S.itens.map(i => { const v = custos[i.id]; return { ...i, custo_unit: v == null ? null : typeof v === "object" ? v.c : v, preco_cobranca: v && typeof v === "object" ? v.p : null }; });
}
let D = {};
function derivar(){
  const porItem = {}; S.lotes.forEach(l => (porItem[l.item_id] ||= []).push(l));
  const byVal = (a,b) => (a.validade || "9999") < (b.validade || "9999") ? -1 : (a.validade || "9999") > (b.validade || "9999") ? 1 : 0;
  const itens = S.itens.filter(i => i.ativo !== false).map(i => {
    const ls = (porItem[i.id] || []).slice().sort(byVal);
    const comSaldo = ls.filter(l => Number(l.quantidade) > 0);
    const saldo = comSaldo.reduce((a,l) => a + Number(l.quantidade), 0);
    const prox = (comSaldo.find(l => l.validade) || {}).validade || null;
    const dProx = diasAte(prox);
    const vencidos = comSaldo.filter(l => l.validade && diasAte(l.validade) < 0);
    const min = Number(i.estoque_minimo || 0);
    let st = "ok";
    if(saldo <= 0) st = "zerado"; else if(vencidos.length) st = "vencido"; else if(min > 0 && saldo < min) st = "baixo"; else if(dProx != null && dProx <= 90) st = "vencendo";
    return { ...i, lotes: ls, comSaldo, saldo, prox, dProx, vencidos, min, st, valor: saldo * Number(i.custo_unit || 0) };
  });
  const grpMap = new Map();
  itens.forEach(i => { const k = i.codigo ? "c:" + norm(i.codigo) : "i:" + i.id; let g = grpMap.get(k);
    if(!g){ g = { key: k, codigo: i.codigo || "", itens: [], saldo: 0, min: 0, ideal: 0 }; grpMap.set(k, g); }
    g.itens.push(i); g.saldo += i.saldo; g.min = Math.max(g.min, i.min); g.ideal = Math.max(g.ideal, Number(i.estoque_ideal || 0)); i.grupo = g; });
  grpMap.forEach(g => { g.nome = g.itens[0].nome; g.fornecedores = [...new Set(g.itens.map(i => i.fornecedor).filter(Boolean))];
    g.prox = g.itens.map(i => i.prox).filter(Boolean).sort()[0] || null; g.unidades = [...new Set(g.itens.map(i => norm(i.unidade)).filter(Boolean))];
    const d = diasAte(g.prox); g.st = g.saldo <= 0 ? "zerado" : g.itens.some(i => i.vencidos.length) ? "vencido" : g.min > 0 && g.saldo < g.min ? "baixo" : d != null && d <= 90 ? "vencendo" : "ok"; });
  itens.forEach(i => { const g = i.grupo; i.st = i.saldo <= 0 ? (g.saldo > 0 ? "semsaldo" : "zerado") : i.vencidos.length ? "vencido" : g.min > 0 && g.saldo < g.min ? "baixo" : i.dProx != null && i.dProx <= 90 ? "vencendo" : "ok"; });
  const grupos = [...grpMap.values()];
  const idx = Object.fromEntries(itens.map(i => [i.id, i]));
  S.itens.filter(i => i.ativo === false).forEach(i => idx[i.id] = { ...i, inativo: true, lotes: [], saldo: 0 });
  const lotesIdx = Object.fromEntries(S.lotes.map(l => [l.id, l]));
  const alertas = [];
  itens.forEach(i => {
    i.comSaldo.forEach(l => { const d = diasAte(l.validade); if(d == null) return;
      if(d < 0) alertas.push({ sev: 0, tipo: "vencido", item: i, lote: l, d });
      else if(d <= 30) alertas.push({ sev: 1, tipo: "vence30", item: i, lote: l, d });
      else if(d <= 90) alertas.push({ sev: 3, tipo: "vence90", item: i, lote: l, d }); });
  });
  grupos.forEach(g => { const rep = g.itens.slice().sort((a, b) => b.saldo - a.saldo)[0];
    if(g.saldo <= 0) alertas.push({ sev: 1, tipo: "zerado", item: rep, grupo: g });
    else if(g.min > 0 && g.saldo < g.min) alertas.push({ sev: 2, tipo: "baixo", item: rep, grupo: g }); });
  alertas.sort((a,b) => a.sev - b.sev || (a.d ?? 0) - (b.d ?? 0));
  const cats = [...new Set(itens.map(i => i.categoria).filter(Boolean))].sort();
  const locais = [...new Set(itens.map(i => i.local).filter(Boolean))].sort();
  D = { itens, idx, lotesIdx, alertas, cats, locais, grupos };
}

const TAB = { listas: "Lista padrão", procedimentos: "Procedimento", movimentacoes: "Movimentação", lotes: "Lote", itens: "Item", usuarios: "Usuário" };
const ACAO = { INSERT: ["Criou","p-ok"], UPDATE: ["Alterou","p-blue"], DELETE: ["Removeu","p-crit"] };
function resumoAud(a){
  const ign = ["criado_em","id","item_id","lote_id","usuario_id"];
  const nomeItem = id => (D.idx[id] || {}).nome || "";
  if(a.acao === "INSERT"){ const d = a.depois || {};
    if(a.tabela === "movimentacoes") return `${TIPO[d.tipo] ? TIPO[d.tipo][0] : d.tipo} de ${fNum(Math.abs(d.quantidade))} · ${esc(nomeItem(d.item_id))}${d.motivo ? " · " + esc(d.motivo) : ""}`;
    if(a.tabela === "lotes") return `Lote ${esc(d.lote || "—")} de ${esc(nomeItem(d.item_id))}`;
    return esc(d.nome || ""); }
  const an = a.antes || {}, dp = a.depois || {};
  const mud = Object.keys({ ...an, ...dp }).filter(k => !ign.includes(k) && JSON.stringify(an[k]) !== JSON.stringify(dp[k]));
  const nome = a.tabela === "lotes" ? `Lote ${esc(dp.lote || an.lote || "—")} (${esc(nomeItem(dp.item_id || an.item_id))}): ` : esc(dp.nome || an.nome || "") + ": ";
  return nome + (mud.map(k => k === "pin_alterado" || k === "pin" ? "PIN alterado" : `${esc(k)} ${esc(an[k] ?? "—")} → ${esc(dp[k] ?? "—")}`).join("; ") || "sem mudança visível");
}
function listaAud(){
  const f = S.f; const xs = S.audit.filter(a => (!f.user || a.usuario_nome === f.user) && (!f.tab || a.tabela === f.tab));
  if(!xs.length) return `<div class="empty">Nenhum registro.</div>`;
  return `<table><thead><tr><th>Data</th><th>Quem</th><th>Ação</th><th>O que mudou</th></tr></thead><tbody>${xs.slice(0, 500).map(a => `<tr><td class="num" style="white-space:nowrap">${fDH(a.criado_em)}</td><td style="white-space:nowrap">${esc(a.usuario_nome || "sistema")}</td><td style="white-space:nowrap"><span class="pill ${ACAO[a.acao][1]}">${ACAO[a.acao][0]}</span> <span class="muted">${TAB[a.tabela] || a.tabela}</span></td><td>${resumoAud(a)}</td></tr>`).join("")}</tbody></table>`;
}

/* ---- nova movimentação ---- */
let M = null;
function novaMov(o = {}){
  M = { tipo: o.tipo || "saida", item_id: o.it || null, lote_id: o.lote || null, q: "", erro: "" };
  if(M.item_id && !M.lote_id) M.lote_id = loteSugerido();
  if(M.tipo === "entrada" && !o.lote) M.lote_id = "novo";
  renderMov();
}
function loteSugerido(){
  const i = D.idx[M.item_id]; if(!i) return null;
  if(M.tipo === "entrada") return "novo";
  const ok = i.comSaldo.filter(l => !(l.validade && diasAte(l.validade) < 0));
  if(M.tipo === "descarte") return (i.vencidos[0] || i.comSaldo[0] || {}).id || null;
  return ((ok[0] || i.comSaldo[0] || i.lotes[0]) || {}).id || null;
}
const MOTIVOS_PADRAO = { entrada: ["Compra","Doação","Devolução"], saida: ["Uso em procedimento","Sala 1","Sala 2","Consultório"], ajuste: ["Contagem de inventário","Erro de digitação"], descarte: ["Vencido","Avaria","Contaminado"] };
function motivosSug(tipo){
  const cont = {}; S.movs.forEach(m => { if(m.tipo !== tipo || m.origem !== "sistema" || !m.motivo) return; const k = String(m.motivo).trim(); if(k) cont[k] = (cont[k] || 0) + 1; });
  const usados = Object.entries(cont).sort((a,b) => b[1] - a[1]).map(([k]) => k);
  const out = []; [...usados, ...MOTIVOS_PADRAO[tipo]].forEach(x => { if(!out.some(y => norm(y) === norm(x))) out.push(x); });
  return out.slice(0, 10);
}
function guardarCampos(){ ["q","motivo","lote","fab","val","busca","paciente"].forEach(k => { const el = $("#m_" + k); if(el) M[k] = el.value; }); }
function renderMov(){
  const i = M.item_id && D.idx[M.item_id];

    <div class="plist" id="m_plist">${resBusca("m", M.busca)}</div>`;
  } else {
    const lotesOp = M.tipo === "entrada" ? i.lotes : i.lotes.filter(l => Number(l.quantidade) > 0 || l.id === M.lote_id || M.tipo === "ajuste");
    const l = M.lote_id && M.lote_id !== "novo" ? D.lotesIdx[M.lote_id] : null;
    corpo += `<div class="picked">${av(i.categoria, 34)}<div>${i.codigo ? `<span class="gcod" style="display:inline-block;margin-bottom:4px;max-width:none">${esc(i.codigo)}</span><br>` : ""}<b>${esc(i.nome)}</b><small>${esc(i.fornecedor || "sem fornecedor")} · ${fNum(i.saldo)} ${esc(low(i.unidade))} · ${esc(i.local || "")}</small></div><span class="sp"></span><button class="btn sm" data-act="mTroca">Trocar</button></div>
    <div><div style="font-size:12.5px;font-weight:600;color:#4A5470;margin-bottom:6px">Lote ${M.tipo === "saida" ? '<span class="muted" style="font-weight:500">· sugerido o que vence primeiro</span>' : ""}</div><div class="lots">
      ${M.tipo === "entrada" ? `<button class="lot ${M.lote_id === "novo" ? "on" : ""}" data-act="mLote" data-id="novo"><input type="radio" tabindex="-1" ${M.lote_id === "novo" ? "checked" : ""}><span><b>Lote novo</b><br><small>informar número e validade</small></span><span></span></button>` : ""}
      ${lotesOp.map(x => `<button class="lot ${M.lote_id === x.id ? "on" : ""}" data-act="mLote" data-id="${x.id}"><input type="radio" tabindex="-1" ${M.lote_id === x.id ? "checked" : ""}><span><b>${esc(x.lote || "sem número")}</b><br><small>validade ${fData(x.validade)}</small></span><span style="text-align:right"><b class="num">${fNum(x.quantidade)}</b><br>${x.validade && diasAte(x.validade) < 0 ? '<span class="pill p-crit">vencido</span>' : ""}</span></button>`).join("") || (M.tipo === "entrada" ? "" : `<div class="note warn">Este item não tem lote com saldo.</div>`)}
    </div></div>

function dataPlan(v){
  if(v == null || v === "") return "";
  if(v instanceof Date) return v.getFullYear() + "-" + String(v.getMonth()+1).padStart(2,"0") + "-" + String(v.getDate()).padStart(2,"0");

  const m = String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(m){ const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return /^\d{4}-\d{2}-\d{2}/.test(String(v)) ? String(v).slice(0,10) : "";
}

function lerImport(buf){

  const nome = wb.SheetNames.find(n => norm(n).includes("moviment")) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, defval: "" }).slice(1).filter(r => r.some(c => String(c).trim() !== ""));
  const tipoMap = { entrada: "entrada", saida: "saida", ajuste: "ajuste", descarte: "descarte" };

/* =====================================================================
   Importar nota fiscal (NF-e em XML ou DANFE em PDF)
   ===================================================================== */
let NF = null;
const UNID_NF = { UN: "UNIDADE", UND: "UNIDADE", UNID: "UNIDADE", CX: "CAIXA", CXA: "CAIXA", PC: "PACOTE", PCT: "PACOTE", PT: "PACOTE", FR: "FRASCO", FRS: "FRASCO", FRA: "FRASCO", AMP: "AMPOLA", AM: "AMPOLA", BG: "BISNAGA", BIS: "BISNAGA", KIT: "KIT", RL: "ROLO", GL: "GALÃO", PAR: "PAR", CJ: "CONJUNTO", FD: "FARDO", SC: "SACO", ENV: "ENVELOPE", BL: "BLISTER", TB: "TUBO", LT: "LITRO", ML: "ML" };
const numBR = v => { if(v == null || v === "") return null; let t = String(v).trim(); if(/,\d+$/.test(t)) t = t.replace(/\./g, "").replace(",", "."); const n = Number(t); return isNaN(n) ? null : n; };
function dataNF(v, fimDoMes){
  if(!v) return "";
  let m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = String(v).match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/); if(m){ const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  m = String(v).match(/^(\d{1,2})[\/.\-](\d{4})$/); if(m){ const mm = m[1].padStart(2,"0"); const d = fimDoMes ? new Date(Number(m[2]), Number(mm), 0).getDate() : 1; return `${m[2]}-${mm}-${String(d).padStart(2,"0")}`; }
  return "";
}
const DT_RE = "(\\d{1,2}[\\/.\\-]\\d{1,2}[\\/.\\-]\\d{2,4}|\\d{1,2}[\\/.\\-]\\d{4})";
function loteDoTexto(txt){
  const t = String(txt || "");
  const lote = (t.match(/\b(?:LOTE|LT)\s*(?:N[º°o.]*)?\s*[:.\-#]?\s*([A-Z0-9][A-Z0-9\/\-.]*[A-Z0-9])/i) || [])[1] || "";
  const val = (t.match(new RegExp("\\b(?:VAL(?:IDADE)?|VENC(?:IMENTO)?|VCTO|VCT|DV|EXP)\\s*[:.\\-]?\\s*" + DT_RE, "i")) || [])[1] || "";
  const fab = (t.match(new RegExp("\\b(?:FAB(?:RICA[ÇC][AÃ]O)?|DF|MFG)\\s*[:.\\-]?\\s*" + DT_RE, "i")) || [])[1] || "";
  return { lote, val: dataNF(val, true), fab: dataNF(fab, false) };
}

/* ---- leitura do XML (NF-e) ---- */
function lerNFeXML(texto){
  const doc = new DOMParser().parseFromString(texto, "application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("O arquivo XML está corrompido ou incompleto.");
  const inf = doc.getElementsByTagName("infNFe")[0];
  if(!inf) throw new Error("Este XML não é de uma NF-e (nota fiscal eletrônica de produtos).");
  const g = (el, tag) => { const x = el && el.getElementsByTagName(tag)[0]; return x ? x.textContent.trim() : ""; };
  const ide = inf.getElementsByTagName("ide")[0], emit = inf.getElementsByTagName("emit")[0];
  const linhas = [];
  [...inf.getElementsByTagName("det")].forEach(det => {
    const p = det.getElementsByTagName("prod")[0]; if(!p) return;
    const base = { cod: g(p, "cProd"), ean: /^\d{8,14}$/.test(g(p, "cEAN")) ? g(p, "cEAN") : "", desc: g(p, "xProd"), ncm: g(p, "NCM"),
      un: g(p, "uCom"), qtdNF: Number(g(p, "qCom")) || 0, custoNF: Number(g(p, "vUnCom")) || null, med: p.getElementsByTagName("med").length > 0 };
    const rastros = [...p.getElementsByTagName("rastro")];
    if(rastros.length) rastros.forEach(r => linhas.push({ ...base, lote: g(r, "nLote"), qtd: Number(g(r, "qLote")) || base.qtdNF, fab: dataNF(g(r, "dFab")), val: dataNF(g(r, "dVal"), true) }));
    else { const x = loteDoTexto(g(det, "infAdProd") + " " + base.desc); linhas.push({ ...base, lote: x.lote, qtd: base.qtdNF, fab: x.fab, val: x.val }); }
  });
  if(!linhas.length) throw new Error("Não encontrei produtos neste XML.");
  return { origem: "XML", chave: (inf.getAttribute("Id") || "").replace(/^NFe/, ""), numero: g(ide, "nNF"), serie: g(ide, "serie"),
    emissao: dataNF(g(ide, "dhEmi") || g(ide, "dEmi")), fornecedor: g(emit, "xFant") || g(emit, "xNome"), cnpj: g(emit, "CNPJ"), linhas };
}

/* ---- leitura do PDF (DANFE), por melhor esforço ---- */
async function lerDanfePDF(buf){
  let pdfjs;
  try { pdfjs = await import(new URL("vendor/pdfjs/pdf.min.mjs", location.href).href); }
  catch(e){ throw new Error("Não consegui carregar o leitor de PDF. Verifique a internet ou use o XML da nota."); }
  pdfjs.GlobalWorkerOptions.workerSrc = new URL("vendor/pdfjs/pdf.worker.min.mjs", location.href).href;
  const pdf = await pdfjs.getDocument({ data: buf }).promise;
  const linhasTxt = [];
  for(let n = 1; n <= pdf.numPages; n++){
    const tc = await (await pdf.getPage(n)).getTextContent();
    const grupos = [];
    tc.items.filter(it => it.str && it.str.trim()).forEach(it => {
      const y = it.transform[5], x = it.transform[4];
      let gr = grupos.find(gg => Math.abs(gg.y - y) < 2.5); if(!gr){ gr = { y, itens: [] }; grupos.push(gr); }
      gr.itens.push({ x, s: it.str.trim() });
    });
    grupos.sort((a, b) => b.y - a.y).forEach(gr => linhasTxt.push(gr.itens.sort((a, b) => a.x - b.x).map(i => i.s).join(" ").replace(/\s+/g, " ")));
  }
  const texto = linhasTxt.join("\n");
  const chave = ((texto.match(/(?:\d{4}\s?){10}\d{4}/) || [])[0] || "").replace(/\s/g, "");
  const numero = ((texto.match(/N[º°o]\.?\s*:?\s*(\d{1,3}(?:\.\d{3})+|\d{1,9})/i) || [])[1] || "").replace(/\./g, "").replace(/^0+(?=\d)/, "");
  const serie = (texto.match(/S[ÉE]RIE\s*:?\s*(\d{1,3})/i) || [])[1] || "";
  const fornecedor = ((texto.match(/RECEBEMOS DE\s+(.+?)\s+OS PRODUTOS/i) || [])[1] || "").trim();
  const emissao = dataNF((texto.match(/EMISS[ÃA]O[^\d]{0,20}(\d{2}\/\d{2}\/\d{4})/i) || [])[1] || "");
  const RE = /^(\S+)\s+(.+?)\s+(\d{8})\s+(\d{3,4})\s+(\d{4})\s+([A-Za-zÀ-ú]{1,6}\.?)\s+(\d[\d.]*,\d+)\s+(\d[\d.]*,\d+)\s+(\d[\d.]*,\d+)/;
  const prods = []; let atual = null;
  linhasTxt.forEach(l => {
    const m = l.match(RE);
    if(m){ atual = { cod: m[1], desc: m[2], ncm: m[3], un: m[6].replace(".", ""), qtdNF: numBR(m[7]) || 0, custoNF: numBR(m[8]), extra: "" }; prods.push(atual); return; }
    if(atual && !/^(DADOS|C[ÁA]LCULO|TRANSPORTADOR|INFORMA[ÇC][ÕO]ES|RESERVADO|VALOR TOTAL|BASE DE C)/i.test(l) && l.length < 160) atual.extra += " " + l;
    if(/^(DADOS ADICIONAIS|C[ÁA]LCULO DO ISSQN)/i.test(l)) atual = null;
  });
  if(!prods.length) throw new Error("Não consegui ler os produtos deste PDF. O layout varia de fornecedor para fornecedor. Use o arquivo XML da nota: o fornecedor é obrigado a enviá-lo, normalmente junto com o PDF no e-mail.");
  const linhas = prods.map(p => { const x = loteDoTexto(p.desc + " " + p.extra); return { cod: p.cod, ean: "", desc: p.desc.trim(), ncm: p.ncm, un: p.un, qtdNF: p.qtdNF, custoNF: p.custoNF, med: false, lote: x.lote, qtd: p.qtdNF, fab: x.fab, val: x.val }; });
  return { origem: "PDF", chave, numero, serie, emissao, fornecedor, cnpj: "", linhas };
}

/* ---- casar com itens do estoque ---- */
function casarItemNF(l, forn){
  const nf = norm(forn); const cod = norm(l.cod), ds = norm(l.desc);
  const fornOk = i => !i.fornecedor || !nf || nf.includes(norm(i.fornecedor)) || norm(i.fornecedor).includes(nf);
  return D.itens.find(i => cod && i.cod_fornecedor && norm(i.cod_fornecedor) === cod && fornOk(i))
        || D.itens.find(i => ds && (norm(i.descricao) === ds || norm(i.nome) === ds)) || null;
}
function prepararNF(nf){
  const catPadrao = med => { const want = med ? "MEDICAÇÃO" : "MATERIAL MÉDICO-HOSPITALAR"; return D.cats.find(c => norm(c) === norm(want)) || (med ? want : D.cats[0] || ""); };
  const localPadrao = D.locais.find(c => norm(c) === "almoxarifado") || D.locais[0] || "";
  nf.linhas = nf.linhas.map(l => {
    const it = casarItemNF(l, nf.fornecedor);
    return { ...l, incluir: true, auto: !!it, item_id: it ? it.id : "novo", fator: 1, qtdFinal: l.qtd, custo: l.custoNF, atualizarCusto: true,
      novo: { codigo: sugerirCodigo(l.desc, catPadrao(l.med)), nome: l.desc.toUpperCase().slice(0, 45), categoria: catPadrao(l.med), local: localPadrao, unidade: UNID_NF[norm(l.un).toUpperCase()] || String(l.un || "").toUpperCase() } };
  });
  const ref = nf.numero ? norm("NF " + nf.numero) : null; const f1 = norm(String(nf.fornecedor || "").split(" ")[0]);
  nf.duplicada = !!ref && S.movs.some(m => m.motivo && norm(m.motivo).includes(ref) && (!f1 || norm(m.motivo).includes(f1)));
  return nf;
}

  const criados = {}, custoFeito = {}; let ok = 0, novos = 0; const falhas = [];

      ok++;
    } catch(e){ falhas.push(`${l.desc.slice(0, 40)}: ${e.message}`); }
  }
  S.audit = null; await carregar(); fechar(); render();
  abrir(`<div class="modal" role="dialog" aria-modal="true">${mHead("Nota fiscal lançada", esc(motivo))}<div class="m-b">
    <div class="note ${falhas.length ? "warn" : "info"}">${ok} ${ok === 1 ? "entrada registrada" : "entradas registradas"}${novos ? `, ${novos} ${novos === 1 ? "item novo criado" : "itens novos criados"}` : ""}.${falhas.length ? ` ${falhas.length} com erro:` : ""}</div>
    ${falhas.length ? `<div class="err">${falhas.map(esc).join("<br>")}</div>` : ""}
    ${novos ? `<p class="muted">Lembre de definir o estoque mínimo dos itens novos (Itens → abrir o item → Editar item).</p>` : ""}</div>
    <div class="m-f"><button class="btn" data-act="nfVerMovs">Ver movimentações</button><button class="btn pri" data-act="fechar">Fechar</button></div></div>`);
}

const dadosProc = (P = PR) => ({ id: P.id, lista_id: P.lista_id || "", nome: P.nome.trim(), codigo_procedimento: P.codigo_procedimento, medicos: P.medicos, anestesistas: P.anestesistas, data: P.data, hora_inicio: P.hora_inicio, hora_fim: P.hora_fim, observacoes: P.observacoes,

  itens: P.itens.map(x => ({ item_id: x.item_id, quantidade: Number(x.quantidade) || 0, usado: !!x.usado, da_lista: !!x.da_lista, lote_id: x.lote_id || "" })) });
async function salvarProc(silencioso){
  prCampos(); if(!PR.nome.trim()){ if(!silencioso){ const e = $("#pr_err"); if(e) e.textContent = "Informe o nome do procedimento."; } return false; }
  const P = PR; while(P._salvando) await P._salvando;
  P._salvando = API.salvarProc(dadosProc(P)).then(r => { if(r && r.id) P.id = r.id; }).finally(() => { P._salvando = null; });
  await P._salvando; return true;
}
function autoSalvarProc(){ clearTimeout(prTimer); prTimer = setTimeout(async () => { if(!PR || PR.etapa === "ver" || !PR.nome.trim()) return; try { await salvarProc(true); } catch(e){ toast("Não consegui salvar automaticamente: " + e.message, true); } }, 700); }

    clearTimeout(prTimer); await salvarProc(); await API.confirmarProc(PR.id); const id = PR.id;
    await carregar(); fechar(); render();

function abrirDocumento(id, antes){
  if(!isAdmin()) return toast("Apenas o administrador pode gerar este documento.", true);
  const w = window.open("", "_blank");
  if(!w){ toast("O navegador bloqueou a nova aba. Permita pop-ups para este site.", true); return; }
  w.document.write('<p style="font-family:Arial;padding:24px;color:#263B65">Preparando o documento…</p>');
  (async () => {
    try { if(antes) await antes(); } catch(e){ w.close(); const el = $("#pr_err"); if(el) el.textContent = e.message; else toast(e.message, true); return; }
    const p = S.procs.find(x => x.id === id); if(!p){ w.close(); toast("Procedimento não encontrado.", true); return; }
    w.document.open(); w.document.write(htmlDocumento(dadosDocumento(p))); w.document.close();
  })();
}

function qcVoltar(){ const v = QC && QC.volta; QC = null; if(v === "m" && M) renderMov(); else if(v === "le" && LE) renderLista(true); else if((v === "pr" || v === "pa") && PR) renderProc(true); else fechar(); }
async function qcSalvar(btn){
  const g = k => ($("#qc_" + k) || {}).value || ""; const err = $("#qc_err");
  if(!g("nome").trim() || !g("categoria").trim()){ err.textContent = "Informe pelo menos o nome e a categoria."; return; }
  const qtd = Number(g("qtd") || 0);
  if(qtd > 0 && g("fab") && g("val") && g("val") < g("fab")){ err.textContent = "A validade não pode ser anterior à fabricação."; return; }
  btn.disabled = true;
  try {
    const r = await API.salvarItem({ nome: g("nome").trim(), codigo: g("codigo").trim().toUpperCase() || sugerirCodigo(g("nome"), g("categoria")), descricao: g("descricao"), categoria: g("categoria").trim().toUpperCase(), unidade: g("unidade").trim().toUpperCase(), local: g("local").trim().toUpperCase(),
      fornecedor: g("fornecedor").trim().toUpperCase(), cod_fornecedor: g("cod_fornecedor"), custo_unit: g("custo"), preco_cobranca: g("preco"), estoque_minimo: g("minimo"), estoque_ideal: "", controlado: false, ativo: true });
    const id = r.id;
    if(qtd > 0) await API.movimentar({ tipo: "entrada", item_id: id, lote_id: null, quantidade: qtd, motivo: "Cadastro rápido", lote: g("lote"), fabricacao: g("fab"), validade: g("val"), origem: "sistema" });
    await carregar(); const v = QC.volta; QC = null;
    if(v === "m" && M){ if(qtd > 0){ fechar(); render(); toast("Item cadastrado e entrada registrada."); return; } M.item_id = id; M.busca = ""; M.lote_id = loteSugerido(); M.erro = ""; renderMov(); }
    else if(v === "le" && LE){ if(!LE.itens.some(x => x.item_id === id)) LE.itens.push({ item_id: id, quantidade: 1 }); LE.busca = ""; renderLista(true); }
    else if(v === "pr" && PR){ PR.itens.push({ item_id: id, quantidade: 1, usado: true, da_lista: false, lote_id: "" }); PR.busca = ""; renderProc(true); autoSalvarProc(); }
    else if(v === "pa" && PR){ PR.novo = { item_id: id, quantidade: 1, lote_id: "" }; PR.busca = ""; renderProc(true); }
    toast(qtd > 0 ? "Item cadastrado e entrada registrada." : "Item cadastrado.");
  } catch(e){ err.textContent = e.message; btn.disabled = false; }
}

function lSync(){ const n = $("#l_nome"), c = $("#l_lembrar"); if(n) L.nome = n.value; if(c) L.lembrar = c.checked; }
function lDig(v){ lSync(); if(L.pin.length >= 6) return; L.pin += v; L.erro = ""; render(); }
async function entrar(){
  lSync(); if(L.enviando) return;
  if(!L.nome.trim()){ L.erro = "Digite seu nome de login."; return render(); }
  if(L.pin.length < 4){ L.erro = "O PIN tem de 4 a 6 números."; return render(); }
  L.enviando = true; render();
  try {
    const u = await API.entrarNome(L.nome.trim(), L.pin); S.sessao = { ...u, pin: L.pin }; store.sset("estoque_sessao", S.sessao);
    if(L.lembrar) store.set("estoque_login_nome", u.nome); else store.del("estoque_login_nome");
    L = { nome: L.lembrar ? u.nome : "", pin: "", erro: "", lembrar: L.lembrar, enviando: false }; tocar();
    await carregarPrivado(); derivar(); location.hash = "#hoje"; render();
  } catch(e){ L.pin = ""; L.erro = e.message; L.enviando = false; render(); }
}

document.addEventListener("click", e => {
  tocar();
  const a = e.target.closest("[data-act]");
  if(a && !a.disabled){ e.preventDefault(); ACT[a.dataset.act] && ACT[a.dataset.act](a.dataset, a, e); return; }
  const go = e.target.closest("[data-go]"); if(go){ location.hash = "#" + go.dataset.go; return; }
  const it = e.target.closest("[data-item]"); if(it){ $("#gres") && ($("#gres").innerHTML = ""); abrirItem(it.dataset.item); return; }
  if(e.target.matches("[data-ov]") && !PR && !LE) fechar();
  if(!e.target.closest(".search") && $("#gres")) $("#gres").innerHTML = "";
});
document.addEventListener("input", e => {
  tocar();
  const t = e.target;
  if(t.dataset.le !== undefined && LE){ const x = LE.itens[Number(t.dataset.le)]; if(x) x.quantidade = t.value; return; }
  if(t.id === "le_busca" && LE){ LE.busca = t.value; $("#le_res").innerHTML = resBusca("le", t.value); return; }
  if(t.id === "pr_busca" && PR){ PR.busca = t.value; $("#pr_res").innerHTML = resBusca(PR.etapa === "ver" ? "pa" : "pr", t.value); return; }
  if(t.dataset.pr !== undefined && PR){ const x = PR.itens[Number(t.dataset.pr)]; if(!x) return; if(t.dataset.prk === "usado"){ prCampos(); x.usado = t.checked; renderProc(true); } else x.quantidade = t.value; autoSalvarProc(); return; }
  if(t.id === "pr_lista" && PR){ prCampos(); const l = S.listas.find(x => x.id === t.value); PR.lista_id = t.value;
    if(l){ const extras = PR.itens.filter(x => !x.da_lista); PR.itens = itensDaLista(l.id).map(x => ({ item_id: x.item_id, quantidade: x.quantidade, usado: false, da_lista: true })).concat(extras); if(!PR.nome.trim()) PR.nome = l.nome; }
    renderProc(true); autoSalvarProc(); return; }
  if(t.dataset.prl !== undefined && PR){ const x = PR.itens[Number(t.dataset.prl)]; if(x){ x.lote_id = t.value; renderProc(true); autoSalvarProc(); } return; }
  if(t.dataset.pre !== undefined && PR){ const e = PR.extras[Number(t.dataset.pre)]; if(e){ e[t.dataset.prek] = t.value; atualizarTotaisProc(); if(PR.etapa !== "ver") autoSalvarProc(); } return; }
  if(t.dataset.prv !== undefined && PR){ const x = PR.itens[Number(t.dataset.prv)]; if(x){ x.valor_unit = t.value === "" ? null : t.value; atualizarTotaisProc(); } return; }
  if(t.id === "pa_qtd" && PR && PR.novo){ PR.novo.quantidade = t.value; return; }
  if(t.id === "pa_lote" && PR && PR.novo){ PR.novo.lote_id = t.value; return; }
  if(t.id === "pr_paciente_cpf" && PR){ const d = t.value.replace(/\D/g, "").slice(0, 11); t.value = d.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2"); PR.paciente_cpf = t.value; return; }
  if(PR && /^pr_(nome|codigo_procedimento|medicos|anestesistas|data|hora_inicio|hora_fim|observacoes|paciente_nome|paciente_convenio|paciente_carteirinha)$/.test(t.id)){ PR[t.id.slice(3)] = t.value; if(PR.etapa === "edit") autoSalvarProc(); return; }
  if(t.dataset.combo){ const inp = $("#" + t.dataset.combo); if(t.value === "__novo"){ inp.style.display = ""; inp.value = ""; inp.focus(); } else { inp.style.display = "none"; inp.value = t.value; } if(t.dataset.combo === "e_categoria" && !$("#e_codigo").value.trim()) infoCodigo(); return; }
  if(t.id === "e_codigo"){ infoCodigo(); return; }
  if(t.dataset.nf !== undefined && NF){ if(nfCampo(t)) renderNF(true); return; }
  if(t.dataset.f){ S.f[t.dataset.f] = t.value; const el = $("#lista"); if(el && PARTS[S.rota]) el.innerHTML = PARTS[S.rota](); return; }
  if(t.id === "m_busca" && M){ M.busca = t.value; $("#m_plist").innerHTML = resBusca("m", t.value); return; }
  if(t.id === "gsearch"){ const q = norm(t.value); const box = $("#gres"); if(!q){ box.innerHTML = ""; return; }
    const xs = D.itens.filter(x => norm([x.nome, x.descricao, x.cod_fornecedor, x.codigo, x.fornecedor, ...x.lotes.map(l => l.lote)].join(" ")).includes(q)).slice(0, 8);
    box.innerHTML = `<div class="sresults">${xs.map(x => `<button data-item="${x.id}">${av(x.categoria, 28)}<span><b>${esc(x.nome)}</b><br><small class="muted">${fNum(x.saldo)} ${esc(low(x.unidade))} · ${esc(x.local || "")}</small></span></button>`).join("") || `<div class="empty">Nada encontrado.</div>`}</div>`; }
});
document.addEventListener("keydown", e => {
  tocar();
  if(e.key === "Escape" && $("#modal").innerHTML && !(PR && PR.etapa !== "ver") && !(LE && !LE.leitura)) fechar();
  if(e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName) && $("#gsearch")){ e.preventDefault(); $("#gsearch").focus(); }
  if(!S.sessao){ const noNome = document.activeElement && document.activeElement.id === "l_nome";
    if(!noNome && /^[0-9]$/.test(e.key)) lDig(e.key);
    if(!noNome && e.key === "Backspace"){ lSync(); L.pin = L.pin.slice(0, -1); render(); }
    if(e.key === "Enter"){ e.preventDefault(); if(noNome && !L.pin) document.activeElement.blur(); else entrar(); } }
  if(e.key === "Enter" && M && e.target.id !== "m_busca" && $("#modal [data-act=mSalvar]")){ e.preventDefault(); salvarMov($("#modal [data-act=mSalvar]")); }
});
window.addEventListener("hashchange", () => { fechar(); render(); window.scrollTo(0, 0); });

/* relógio, sessão inativa (30 min) e atualização automática a cada 60 s */
setInterval(() => {
  const c = $("#clock"); if(c) c.textContent = "· " + fHora(Date.now());
  if(S.sessao && Date.now() - ultimoToque > 30 * 60e3){ sair(); toast("Sessão encerrada por inatividade."); }
}, 15e3);
if(ONLINE) setInterval(async () => { if(S.sessao && !$("#modal").innerHTML && document.visibilityState === "visible"){ await carregar(true); render(); } }, 60e3);
if(ONLINE && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

(async () => {
  if(S.sessao && S.sessao.id){ try { await API.entrar(S.sessao.id, S.sessao.pin); } catch(e){ if(!/fetch|network|rede/i.test(e.message)){ S.sessao = null; store.sdel("estoque_sessao"); } } }
  await carregar(); render();
})();
</script>
</body>
</html>
