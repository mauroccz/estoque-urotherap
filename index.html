<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E9AA7">
<title>Estoque UROtherap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar fixa + área de trabalho em cards; no celular vira barra inferior */
:root{
  --bg:#EDF3F6; --surface:#FFFFFF; --surface-2:#F6FAFB; --line:#E1E9EE; --ink:#14242F; --muted:#6C7F8B;
  --accent:#0E9AA7; --accent-2:#0A7E8B; --accent-soft:#E2F4F6;
  --ok:#1E9A69; --ok-soft:#E4F5EC; --warn:#B9770E; --warn-soft:#FDF2DE; --crit:#D2463F; --crit-soft:#FCE8E6;
  --violet:#7259C4; --violet-soft:#EEEAFA; --blue:#2C77CC; --blue-soft:#E5EFFB;
  --navy:#0F2A3B;
  --font:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px; --r-sm:10px; --shadow:0 1px 2px rgba(16,42,59,.04), 0 6px 20px rgba(16,42,59,.05);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#16B3BF,var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(14,154,167,.3)}
.brand b{font-size:19px;letter-spacing:-.01em}
.clinic{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.clinic .ci{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center}
.clinic b{display:block;font-size:13px}.clinic small{color:var(--muted);font-size:11.5px}
.navlbl{font-size:11px;letter-spacing:.12em;color:#93A3AD;font-weight:600;padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#3D5260;text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .badge{margin-left:auto;background:var(--crit-soft);color:var(--crit);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.duty{background:radial-gradient(120% 120% at 100% 0%,#1C5C70 0%,var(--navy) 55%);color:#fff;border-radius:14px;padding:14px}
.duty small{color:#A9C3CF;font-size:11.5px}
.duty .av-row{display:flex;margin:10px 0 8px}
.duty .av-row .av{margin-left:-6px;border:2px solid var(--navy)}.duty .av-row .av:first-child{margin-left:0}
.duty b{font-size:13px}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px}
.me b{display:block;font-size:13px}.me small{color:var(--muted);font-size:11.5px}
.me button{margin-left:auto}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--muted);position:relative}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%;color:var(--ink)}
.search kbd{font:600 11px var(--font);background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.sresults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:20;max-height:360px;overflow:auto}
.sresults button{display:flex;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;gap:10px;align-items:center}
.sresults button:hover{background:var(--surface-2)}
.top .sp{flex:1}
.when{display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}.when b{color:var(--ink)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative;color:#3D5260}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:99px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:linear-gradient(135deg,#14AEBA,var(--accent-2));color:#fff;border:0;box-shadow:0 4px 14px rgba(14,154,167,.28)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.content{padding:26px 28px 40px;display:flex;flex-direction:column;gap:20px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;font-size:13px}
.banner.demo{background:var(--blue-soft);color:#1F5A9E}
.banner.off{background:var(--warn-soft);color:#8A5A08}
.banner.warn{background:var(--warn-soft);color:#8A5A08}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:24px;letter-spacing:-.015em}
.head p{margin:4px 0 0;color:var(--muted)}
.head .sp{flex:1}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.card-h h2{font-size:15px}
.card-h .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-violet{background:var(--violet-soft);color:var(--violet)}.p-blue{background:var(--blue-soft);color:var(--blue)}.p-mute{background:#EEF2F4;color:#5D707C}.p-acc{background:var(--accent-soft);color:var(--accent-2)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi:hover{border-color:#CFDDE4}
.kpi .kh{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.kpi .kic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.kpi .kv{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kpi .kv small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .ks{color:var(--muted);font-size:12px}
.grid-home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.tl{padding:4px 18px 16px;display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.tl-row:first-child{border-top:0}
.tl-t{color:var(--muted);font-size:12px}
.chip{border-left:3px solid;border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;min-width:0}
.chip b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font-size:12px;opacity:.85}
.c-entrada{background:var(--ok-soft);border-color:var(--ok);color:#16583F}
.c-saida{background:var(--blue-soft);border-color:var(--blue);color:#1D4E86}
.c-ajuste{background:var(--violet-soft);border-color:var(--violet);color:#4B3A87}
.c-descarte{background:var(--crit-soft);border-color:var(--crit);color:#8C2E2A}
.qty{font-weight:700;font-size:13px;text-align:right;white-space:nowrap}
.q-pos{color:var(--ok)}.q-neg{color:var(--blue)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.hero{margin:4px 14px 10px;border-radius:14px;padding:16px;color:#fff;background:radial-gradient(90% 120% at 100% 100%,rgba(255,255,255,.18),transparent 60%),linear-gradient(140deg,#13A9B5,#0A6F7C);position:relative;overflow:hidden;cursor:pointer}
.hero.crit{background:radial-gradient(90% 120% at 100% 100%,rgba(255,255,255,.16),transparent 60%),linear-gradient(140deg,#E0625A,#A8322C)}
.hero small{opacity:.85;font-size:12px}
.hero .hv{font-size:22px;font-weight:700;margin:6px 0 2px;letter-spacing:-.01em}
.hero .hs{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.hero .tag{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.al{display:flex;flex-direction:column;padding:0 14px 12px}
.al-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit}
.al-row:hover{background:var(--surface-2)}
.al-row b{display:block;font-size:13px}.al-row small{color:var(--muted);font-size:12px}
.al-code{font-size:11px;font-weight:700;width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.al-r{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}.al-r b{font-size:13px}
.bars{padding:4px 18px 18px;display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:180px 1fr 110px;gap:12px;align-items:center;font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#16B3BF,var(--accent-2));border-radius:99px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

/* ---------- Tabelas e filtros ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.toolbar .search{max-width:none;flex:1;min-width:200px}
.field,select.field{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;min-width:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8597A2;font-weight:600;text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#FAFCFD}
td .sub{display:block;color:var(--muted);font-size:12px;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.r,th.r{text-align:right}
.level{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.level .bar{width:70px;height:6px}
.level .bar i.low{background:var(--crit)}.level .bar i.mid{background:#E0A53A}
.groups{display:flex;flex-direction:column;gap:16px}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pad{padding:4px 18px 18px}
.pad p{margin:0 0 12px;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:rgba(15,42,59,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:18px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 20px 60px rgba(15,42,59,.25)}
.modal.wide{width:min(860px,100%)}
.ov.drawer{justify-content:flex-end;padding:0}
.ov.drawer .modal{height:100%;max-height:none;border-radius:18px 0 0 18px;width:min(640px,100%)}
.m-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 8px;position:sticky;top:0;background:#fff;z-index:2}
.m-h h2{font-size:18px}.m-h p{margin:3px 0 0;color:var(--muted);font-size:13px}
.m-h .sp{flex:1}
.m-b{padding:10px 22px 8px;display:flex;flex-direction:column;gap:14px}
.m-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 20px;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;cursor:pointer;color:#4E6371}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(16,42,59,.1);color:var(--ink)}
.seg button.on[data-v="entrada"]{color:var(--ok)}.seg button.on[data-v="saida"]{color:var(--blue)}.seg button.on[data-v="ajuste"]{color:var(--violet)}.seg button.on[data-v="descarte"]{color:var(--crit)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:#4E6371}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:400;background:#fff;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.picked{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.picked b{display:block}.picked small{color:var(--muted)}
.picked .sp{flex:1}
.plist{border:1px solid var(--line);border-radius:12px;max-height:260px;overflow:auto}
.plist button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:10px 12px;cursor:pointer}
.plist button:last-child{border-bottom:0}.plist button:hover{background:var(--surface-2)}
.plist .sp{flex:1}
.lots{display:flex;flex-direction:column;gap:6px}
.lot{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:#fff;text-align:left}
.lot.on{border-color:var(--accent);background:var(--accent-soft)}
.lot input{accent-color:var(--accent)}
.lot small{color:var(--muted)}
.note{border-radius:10px;padding:9px 12px;font-size:13px}
.note.warn{background:var(--warn-soft);color:#8A5A08}.note.crit{background:var(--crit-soft);color:#8C2E2A}.note.info{background:var(--accent-soft);color:var(--accent-2)}
.err{color:var(--crit);font-size:13px;font-weight:600}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dl div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dl small{display:block;color:var(--muted);font-size:11.5px}.dl b{font-size:13.5px;word-break:break-word}
.check{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- Login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 50% at 80% 0%,#D5EEF2,transparent),var(--bg)}
.lcard{width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:18px}
.lcard h1{font-size:22px}
.ulist{display:flex;flex-direction:column;gap:8px}
.ubtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left}
.ubtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.ubtn small{color:var(--muted);display:block;font-size:12px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid #B8C7CF}
.pin-dots i.f{background:var(--accent);border-color:var(--accent)}
.pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad-grid button{height:56px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:600;cursor:pointer}
.pad-grid button:active{background:var(--accent-soft)}
.pad-grid button.ghost{border:0;background:none;font-size:14px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(15,42,59,.3);z-index:80;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast.bad{background:#8C2E2A}
.mobnav,.fab{display:none}

/* ---------- Responsivo ---------- */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-home{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:10px 16px}
  .top .when,.top .hide-m{display:none}
  .content{padding:18px 16px 96px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .kv{font-size:24px}
  .cards2,.row3,.dl{grid-template-columns:1fr}
  .bar-row{grid-template-columns:110px 1fr 90px}
  .mobnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);text-decoration:none;padding:4px 0;font-weight:600}
  .mobnav a.on{color:var(--accent-2)}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:78px;width:56px;height:56px;border-radius:18px;border:0;background:linear-gradient(135deg,#14AEBA,var(--accent-2));color:#fff;box-shadow:0 8px 24px rgba(14,154,167,.4);z-index:31;cursor:pointer}
  .ov{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:94%}
  .ov.drawer .modal{border-radius:18px 18px 0 0;height:94%}
  .hide-m{display:none}
}
@media (max-width:420px){.row2{grid-template-columns:1fr}.tl-row{grid-template-columns:44px 1fr auto}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>window.ESTOQUE_CONFIG = window.ESTOQUE_CONFIG || {};</script>
<script src="config.js" onerror="void 0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* =====================================================================
   ESTOQUE UROtherap — aplicativo de página única
   Sem config.js preenchido: roda em MODO DEMONSTRAÇÃO (dados da planilha,
   alterações salvas só neste navegador). Com config.js: usa o Supabase.
   ===================================================================== */
const CFG = window.ESTOQUE_CONFIG || {};

const API = ONLINE ? (() => {
  const base = CFG.supabaseUrl.replace(/\/$/,"") + "/rest/v1/";
  const H = { apikey: CFG.supabaseAnonKey, Authorization: "Bearer " + CFG.supabaseAnonKey, "Content-Type": "application/json" };
  async function req(path, opt = {}){
    const r = await fetch(base + path, { ...opt, headers: { ...H, ...(opt.headers || {}) } });
    if(!r.ok){ let m = r.status + ""; try { const j = await r.json(); m = j.message || j.hint || m; } catch(e){} throw new Error(m); }
    return r.status === 204 ? null : r.json();
  }
  async function todos(tabela, ordem){
    const out = []; for(let o = 0; ; o += 1000){ const p = await req(`${tabela}?select=*&order=${ordem}&limit=1000&offset=${o}`); out.push(...p); if(p.length < 1000) break; } return out;
  }
  async function rpc(nome, corpo){
    const s = S.sessao || {};
    const r = await req("rpc/" + nome, { method: "POST", body: JSON.stringify({ p_usuario: s.id, p_pin: s.pin, ...corpo }) });
    if(r && r.ok === false) throw new Error(r.erro || "Não foi possível salvar.");
    return r;
  }
  return {
    async carregar(){
      const [usuarios, itens, lotes, movs, config] = await Promise.all([
        req("usuarios_publicos?select=*&order=nome"), todos("itens","nome"), todos("lotes","validade.nullslast"),
        req("movimentacoes?select=*&order=id.desc&limit=1000"), req("config?select=*")
      ]);
      return { usuarios, itens, lotes, movs, config: Object.fromEntries(config.map(c => [c.chave, c.valor])) };
    },
    async todasMovs(){ return todos("movimentacoes","id.desc"); },
    async entrar(id, pin){
      const r = await req("rpc/entrar", { method: "POST", body: JSON.stringify({ p_usuario: id, p_pin: pin }) });
      if(!r.ok) throw new Error(r.erro); return r.usuario;
    },
    movimentar: d => rpc("movimentar", { p_dados: d }),
    salvarItem: i => rpc("salvar_item", { p_item: i }),
    salvarUsuario: u => rpc("salvar_usuario", { p_dados: u }),
    async auditoria(){ return (await rpc("ler_auditoria", { p_limite: 3000 })).dados; },
    registrarBackup: () => rpc("registrar_backup", {})
  };

      if(l.quantidade + delta < 0) throw new Error(`Saldo insuficiente no lote (disponível: ${fNum(l.quantidade)}).`);
      const antes = { ...l }; l.quantidade = l.quantidade + delta; aud(u, "UPDATE", "lotes", antes, l);
      const m = { id: db.seq++, item_id: d.item_id, lote_id: l.id, tipo: t, quantidade: delta, saldo_lote: l.quantidade, motivo: String(d.motivo || "").trim() || null, usuario_id: u.id, usuario_nome: u.nome, origem: d.origem || "sistema", criado_em: new Date().toISOString() };
      db.movs.unshift(m); aud(u, "INSERT", "movimentacoes", null, m); salvar(); return { ok: true, id: m.id };
    },
    async salvarItem(i){
      const u = quem(true);
      if(!String(i.nome||"").trim() || !String(i.categoria||"").trim()) throw new Error("Nome e categoria são obrigatórios.");
      const campos = ["codigo","nome","descricao","categoria","unidade","local","cod_fornecedor","fornecedor"];
      const num = k => i[k] === "" || i[k] == null ? (k === "custo_unit" ? null : 0) : Number(i[k]);
      if(!i.id){ const n = { id: novoId(), ativo: true }; campos.forEach(k => n[k] = i[k] || null); n.custo_unit = num("custo_unit"); n.estoque_minimo = num("estoque_minimo"); n.estoque_ideal = num("estoque_ideal"); n.controlado = !!i.controlado; db.itens.push(n); aud(u, "INSERT", "itens", null, n); salvar(); return { ok: true, id: n.id }; }
      const it = db.itens.find(x => x.id === i.id); const antes = { ...it };
      campos.forEach(k => it[k] = i[k] || null); it.custo_unit = num("custo_unit"); it.estoque_minimo = num("estoque_minimo"); it.estoque_ideal = num("estoque_ideal"); it.controlado = !!i.controlado; it.ativo = i.ativo !== false;
      aud(u, "UPDATE", "itens", antes, it); salvar(); return { ok: true, id: it.id };
    },
    async salvarUsuario(d){
      const u = quem(true); const pin = String(d.pin || "");
      if(pin && !/^\d{4}$/.test(pin)) throw new Error("O PIN deve ter 4 números.");
      const nome = String(d.nome || "").trim(); if(!nome) throw new Error("Informe o nome.");
      if(db.usuarios.some(x => norm(x.nome) === norm(nome) && x.id !== d.id)) throw new Error("Já existe um usuário com esse nome.");
      if(!d.id){ if(!pin) throw new Error("Defina um PIN de 4 números."); const n = { id: novoId(), nome, papel: d.papel || "funcionaria", ativo: true, pin }; db.usuarios.push(n); aud(u, "INSERT", "usuarios", null, n); salvar(); return { ok: true }; }
      if(d.id === u.id && (d.ativo === false || d.papel !== "admin")) throw new Error("Você não pode desativar nem rebaixar o próprio acesso.");
      const x = db.usuarios.find(y => y.id === d.id); const antes = { ...x };
      x.nome = nome; x.papel = d.papel; x.ativo = d.ativo !== false; if(pin) x.pin = pin;
      const dep = { ...x }; if(pin) dep.pin_alterado = true; aud(u, "UPDATE", "usuarios", antes, dep); salvar(); return { ok: true };
    },
    async auditoria(){ quem(true); return db.aud; },
    async registrarBackup(){ const u = quem(false); db.config.ultimo_backup = new Date().toISOString(); db.config.ultimo_backup_por = u.nome; salvar(); return { ok: true }; },
    resetar(){ db = inicial(); salvar(); }
  };
})();

async function carregar(silencioso){
  try {
    const d = await API.carregar();
    Object.assign(S, d); S.offline = false; S.carregadoEm = new Date().toISOString();
    if(ONLINE) store.set("estoque_cache", { em: S.carregadoEm, ...d });
  } catch(e){
    const c = ONLINE && store.get("estoque_cache");
    if(c){ Object.assign(S, { usuarios: c.usuarios, itens: c.itens, lotes: c.lotes, movs: c.movs, config: c.config || {} }); S.offline = true; S.cacheEm = c.em; }
    else if(!silencioso) { S.erroCarga = e.message || "Falha de conexão"; }
  }
  derivar();
}
let D = {};
function derivar(){
  const porItem = {}; S.lotes.forEach(l => (porItem[l.item_id] ||= []).push(l));
  const byVal = (a,b) => (a.validade || "9999") < (b.validade || "9999") ? -1 : (a.validade || "9999") > (b.validade || "9999") ? 1 : 0;
  const itens = S.itens.filter(i => i.ativo !== false).map(i => {
    const ls = (porItem[i.id] || []).slice().sort(byVal);
    const comSaldo = ls.filter(l => Number(l.quantidade) > 0);
    const saldo = comSaldo.reduce((a,l) => a + Number(l.quantidade), 0);
    const prox = (comSaldo.find(l => l.validade) || {}).validade || null;
    const dProx = diasAte(prox);
    const vencidos = comSaldo.filter(l => l.validade && diasAte(l.validade) < 0);
    const min = Number(i.estoque_minimo || 0);
    let st = "ok";
    if(saldo <= 0) st = "zerado"; else if(vencidos.length) st = "vencido"; else if(min > 0 && saldo < min) st = "baixo"; else if(dProx != null && dProx <= 90) st = "vencendo";
    return { ...i, lotes: ls, comSaldo, saldo, prox, dProx, vencidos, min, st, valor: saldo * Number(i.custo_unit || 0) };
  });
  const idx = Object.fromEntries(itens.map(i => [i.id, i]));
  S.itens.filter(i => i.ativo === false).forEach(i => idx[i.id] = { ...i, inativo: true, lotes: [], saldo: 0 });
  const lotesIdx = Object.fromEntries(S.lotes.map(l => [l.id, l]));
  const alertas = [];
  itens.forEach(i => {
    i.comSaldo.forEach(l => { const d = diasAte(l.validade); if(d == null) return;
      if(d < 0) alertas.push({ sev: 0, tipo: "vencido", item: i, lote: l, d });
      else if(d <= 30) alertas.push({ sev: 1, tipo: "vence30", item: i, lote: l, d });
      else if(d <= 90) alertas.push({ sev: 3, tipo: "vence90", item: i, lote: l, d }); });
    if(i.saldo <= 0) alertas.push({ sev: 1, tipo: "zerado", item: i });
    else if(i.min > 0 && i.saldo < i.min) alertas.push({ sev: 2, tipo: "baixo", item: i });
  });
  alertas.sort((a,b) => a.sev - b.sev || (a.d ?? 0) - (b.d ?? 0));
  const cats = [...new Set(itens.map(i => i.categoria).filter(Boolean))].sort();
  const locais = [...new Set(itens.map(i => i.local).filter(Boolean))].sort();
  D = { itens, idx, lotesIdx, alertas, cats, locais };
}

  ok: ["p-ok","Em dia"], vencendo: ["p-warn","Vencendo"], baixo: ["p-warn","Abaixo do mínimo"], vencido: ["p-crit","Lote vencido"], zerado: ["p-crit","Zerado"]

function movsFiltradas(lista){

    <td><span style="display:inline-flex;align-items:center;gap:8px">${av(m.usuario_nome || "?")}<span class="hide-m">${esc(m.usuario_nome || "—")}</span></span></td></tr>`; }).join("")}
  </tbody></table>${ms.length > 500 ? `<div class="empty">Mostrando 500 de ${ms.length}. Use a exportação para ver todas.</div>` : ""}`;

/* ---- Relatórios e backup ---- */

  const mx = Math.max(1, ...rank.map(x => x.q));
  const perdas = S.movs.filter(m => m.tipo === "descarte").reduce((a,m) => a + (-m.quantidade) * Number((D.idx[m.item_id] || {}).custo_unit || 0), 0);
  return `${banners()}<div class="head"><div><h1>Relatórios e backup</h1><p>Exporte tudo em planilha para guardar uma cópia fora do sistema.</p></div></div>
  <div class="cards2">
    <div class="card"><div class="card-h"><span class="kic" style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2)">${ic("sheet",18)}</span><h2>Backup completo</h2></div>
      <div class="pad"><p>Um arquivo .xlsx com uma aba para cada parte: estoque atual, lotes (no mesmo formato da planilha original), movimentações, usuários${isAdmin() ? " e auditoria" : ""}.</p>
      <p><b style="color:var(--ink)">Último backup:</b> ${ub ? fDH(ub) + (S.config.ultimo_backup_por ? " por " + esc(S.config.ultimo_backup_por) : "") : "nunca feito"}</p>
      <button class="btn pri" data-act="backup">${ic("down",16)}Baixar backup completo</button></div></div>
    <div class="card"><div class="card-h"><span class="kic" style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn)">${ic("alert",18)}</span><h2>Se o sistema cair</h2></div>

      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="contingencia">${ic("down",16)}Planilha de contingência</button>${isAdmin() && !S.offline ? `<button class="btn" data-act="importar">${ic("up",16)}Importar contingência</button>` : ""}</div></div></div>

    <div class="card"><div class="card-h"><h2>Resumo</h2></div><div class="pad"><div class="dl" style="grid-template-columns:1fr 1fr">
      <div><small>Valor em estoque</small><b class="num">${fBRL(D.itens.reduce((a,i) => a + i.valor, 0))}</b></div>

  </div>`;
}

    <select class="field" data-f="tab" aria-label="Tabela"><option value="">Tudo</option>${[["movimentacoes","Movimentações"],["lotes","Lotes"],["itens","Itens"],["usuarios","Usuários"]].map(([v,t]) => `<option value="${v}" ${f.tab === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>

const TAB = { movimentacoes: "Movimentação", lotes: "Lote", itens: "Item", usuarios: "Usuário" };
const ACAO = { INSERT: ["Criou","p-ok"], UPDATE: ["Alterou","p-blue"], DELETE: ["Removeu","p-crit"] };
function resumoAud(a){
  const ign = ["criado_em","id","item_id","lote_id","usuario_id"];
  const nomeItem = id => (D.idx[id] || {}).nome || "";
  if(a.acao === "INSERT"){ const d = a.depois || {};
    if(a.tabela === "movimentacoes") return `${TIPO[d.tipo] ? TIPO[d.tipo][0] : d.tipo} de ${fNum(Math.abs(d.quantidade))} · ${esc(nomeItem(d.item_id))}${d.motivo ? " · " + esc(d.motivo) : ""}`;
    if(a.tabela === "lotes") return `Lote ${esc(d.lote || "—")} de ${esc(nomeItem(d.item_id))}`;
    return esc(d.nome || ""); }
  const an = a.antes || {}, dp = a.depois || {};
  const mud = Object.keys({ ...an, ...dp }).filter(k => !ign.includes(k) && JSON.stringify(an[k]) !== JSON.stringify(dp[k]));
  const nome = a.tabela === "lotes" ? `Lote ${esc(dp.lote || an.lote || "—")} (${esc(nomeItem(dp.item_id || an.item_id))}): ` : esc(dp.nome || an.nome || "") + ": ";
  return nome + (mud.map(k => k === "pin_alterado" || k === "pin" ? "PIN alterado" : `${esc(k)} ${esc(an[k] ?? "—")} → ${esc(dp[k] ?? "—")}`).join("; ") || "sem mudança visível");
}
function listaAud(){
  const f = S.f; const xs = S.audit.filter(a => (!f.user || a.usuario_nome === f.user) && (!f.tab || a.tabela === f.tab));
  if(!xs.length) return `<div class="empty">Nenhum registro.</div>`;
  return `<table><thead><tr><th>Data</th><th>Quem</th><th>Ação</th><th>O que mudou</th></tr></thead><tbody>${xs.slice(0, 500).map(a => `<tr><td class="num" style="white-space:nowrap">${fDH(a.criado_em)}</td><td style="white-space:nowrap">${esc(a.usuario_nome || "sistema")}</td><td style="white-space:nowrap"><span class="pill ${ACAO[a.acao][1]}">${ACAO[a.acao][0]}</span> <span class="muted">${TAB[a.tabela] || a.tabela}</span></td><td>${resumoAud(a)}</td></tr>`).join("")}</tbody></table>`;
}

/* ---- nova movimentação ---- */
let M = null;
function novaMov(o = {}){
  M = { tipo: o.tipo || "saida", item_id: o.it || null, lote_id: o.lote || null, q: "", erro: "" };
  if(M.item_id && !M.lote_id) M.lote_id = loteSugerido();
  if(M.tipo === "entrada" && !o.lote) M.lote_id = "novo";
  renderMov();
}
function loteSugerido(){
  const i = D.idx[M.item_id]; if(!i) return null;
  if(M.tipo === "entrada") return "novo";
  const ok = i.comSaldo.filter(l => !(l.validade && diasAte(l.validade) < 0));
  if(M.tipo === "descarte") return (i.vencidos[0] || i.comSaldo[0] || {}).id || null;
  return ((ok[0] || i.comSaldo[0] || i.lotes[0]) || {}).id || null;
}
function guardarCampos(){ ["q","motivo","lote","fab","val","busca"].forEach(k => { const el = $("#m_" + k); if(el) M[k] = el.value; }); }
function renderMov(){

function baixarXlsx(nome, abas){
  if(!xlsxOk()) return false;
  const wb = XLSX.utils.book_new();
  abas.forEach(({ nome: n, linhas, cab }) => {
    const ws = linhas.length ? XLSX.utils.json_to_sheet(linhas) : XLSX.utils.aoa_to_sheet([cab || ["(vazio)"]]);
    const cols = Object.keys(linhas[0] || {}).length ? Object.keys(linhas[0]) : (cab || []);
    ws["!cols"] = cols.map(c => ({ wch: Math.min(60, Math.max(String(c).length + 2, ...linhas.slice(0, 300).map(r => String(r[c] ?? "").length + 2))) }));
    XLSX.utils.book_append_sheet(wb, ws, n.slice(0, 31));
  });
  try { XLSX.writeFile(wb, nome); } catch(e){ toast("O navegador bloqueou o download.", true); return false; }
  if(!ONLINE) toast("Planilha gerada. Na prévia do Claude o download pode ser bloqueado; na versão publicada ele baixa normalmente.");
  return true;
}

function dataPlan(v){
  if(v == null || v === "") return "";
  if(v instanceof Date) return v.getFullYear() + "-" + String(v.getMonth()+1).padStart(2,"0") + "-" + String(v.getDate()).padStart(2,"0");
  if(typeof v === "number"){ const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}` : ""; }
  const m = String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(m){ const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return /^\d{4}-\d{2}-\d{2}/.test(String(v)) ? String(v).slice(0,10) : "";
}
let IMP = [];
function importar(){

  $("#imp_file").addEventListener("change", ev => { const f = ev.target.files[0]; if(!f || !xlsxOk()) return; const r = new FileReader(); r.onload = () => { try { lerImport(new Uint8Array(r.result)); } catch(e){ $("#imp_prev").innerHTML = `<div class="err">Não consegui ler o arquivo: ${esc(e.message)}</div>`; } }; r.readAsArrayBuffer(f); });

function lerImport(buf){
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const nome = wb.SheetNames.find(n => norm(n).includes("moviment")) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, defval: "" }).slice(1).filter(r => r.some(c => String(c).trim() !== ""));
  const tipoMap = { entrada: "entrada", saida: "saida", ajuste: "ajuste", descarte: "descarte" };
  IMP = rows.map((r, n) => {
    const [dt, itemN, loteN, tipoT, qtd, motivo, resp, val, fab] = r; const o = { n: n + 2, raw: r, erro: "" };
    if(norm(motivo).startsWith("exemplo")) { o.erro = "Linha de exemplo (ignorada)"; return o; }
    const it = D.itens.find(i => norm(i.nome) === norm(itemN)) || D.itens.find(i => norm(i.descricao) === norm(itemN));
    o.tipo = tipoMap[norm(tipoT)]; o.q = Number(String(qtd).replace(",", "."));
    if(!it) o.erro = "Item não encontrado"; else if(!o.tipo) o.erro = "Tipo inválido"; else if(!(o.q >= 0)) o.erro = "Quantidade inválida";
    if(it){ o.item = it; const l = it.lotes.find(x => norm(x.lote) === norm(loteN));
      if(l) o.lote = l; else if(o.tipo === "entrada") o.novo = { lote: String(loteN || ""), validade: dataPlan(val), fabricacao: dataPlan(fab) }; else if(!o.erro) o.erro = "Lote não encontrado"; }
    o.motivo = `[Contingência ${dataPlan(dt) ? fData(dataPlan(dt)) : String(dt)}${resp ? " · " + resp : ""}] ${motivo || ""}`.trim();
    if(!o.erro && (o.tipo === "ajuste" || o.tipo === "descarte") && !String(motivo || "").trim()) o.erro = "Motivo obrigatório";
    return o;
  });
  const ok = IMP.filter(x => !x.erro).length;
  $("#imp_prev").innerHTML = `<div class="note ${ok ? "info" : "warn"}">${ok} de ${IMP.length} linhas prontas para importar. As linhas serão registradas em ordem e marcadas como contingência na auditoria.</div>
  <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:12px;margin-top:10px"><table><thead><tr><th>Linha</th><th>Item</th><th>Lote</th><th>Tipo</th><th class="r">Qtd.</th><th>Situação</th></tr></thead><tbody>${IMP.map(x => `<tr><td>${x.n}</td><td>${esc(x.item ? x.item.nome : x.raw[1])}</td><td>${esc(x.lote ? x.lote.lote : x.novo ? x.novo.lote + " (novo)" : x.raw[2])}</td><td>${x.tipo ? TIPO[x.tipo][0] : esc(x.raw[3])}</td><td class="r num">${esc(x.raw[4])}</td><td>${x.erro ? `<span class="pill p-crit">${esc(x.erro)}</span>` : '<span class="pill p-ok">OK</span>'}</td></tr>`).join("")}</tbody></table></div>`;
  $("#imp_ok").disabled = !ok;
}
async function impConfirmar(btn){
  btn.disabled = true; let ok = 0; const falhas = [];
  for(const x of IMP.filter(y => !y.erro)){
    try { await API.movimentar({ tipo: x.tipo, item_id: x.item.id, lote_id: x.lote ? x.lote.id : null, quantidade: x.q, motivo: x.motivo, origem: "contingencia", ...(x.novo || {}) }); ok++; }
    catch(e){ falhas.push(`Linha ${x.n}: ${e.message}`); }
    if(x.lote){ await carregar(true); }
  }
  fechar(); S.audit = null; await carregar(); render();
  toast(`${ok} movimentações importadas.` + (falhas.length ? ` ${falhas.length} com erro: ${falhas.slice(0,2).join(" | ")}` : ""), !!falhas.length);
}

/* =====================================================================
   Login por nome + PIN
   ===================================================================== */
let L = { u: null, pin: "", erro: "" };
function vLogin(){
  const us = S.usuarios.filter(u => u.ativo);
  if(S.erroCarga && !S.offline) return `<div class="login"><div class="card lcard"><div class="brand"><span class="logo">${ic("cross",18,2.6)}</span><b>Estoque ${esc(CLINICA)}</b></div><div class="note crit">Não foi possível conectar ao servidor (${esc(S.erroCarga)}). Verifique a internet e o arquivo config.js.</div><button class="btn pri" data-act="recarregar">Tentar de novo</button></div></div>`;
  const u = L.u && us.find(x => x.id === L.u);
  return `<div class="login"><div class="card lcard">
    <div class="brand"><span class="logo">${ic("cross",18,2.6)}</span><b>Estoque ${esc(CLINICA)}</b></div>
    ${!ONLINE ? `<div class="banner demo">${ic("db",16)}<span>Demonstração: Administrador usa PIN <b>1234</b> e Enfermagem (exemplo) usa <b>1111</b>.</span></div>` : ""}
    ${S.offline ? `<div class="banner off">${ic("wifi",16)}<span>Sem conexão. Você pode consultar a cópia salva em ${fDH(S.cacheEm)} e baixar a planilha de contingência.</span></div><button class="btn pri" data-act="consultaOffline">Consultar cópia offline</button>` : !u ? `
      <div><h1>Quem está usando?</h1><p class="muted" style="margin:4px 0 0">Toque no seu nome</p></div>
      <div class="ulist">${us.map(x => `<button class="ubtn" data-act="lUser" data-id="${x.id}">${av(x.nome,36)}<span><b>${esc(x.nome)}</b><small>${x.papel === "admin" ? "Administrador" : "Funcionária"}</small></span></button>`).join("") || `<div class="empty">Nenhum usuário ativo.</div>`}</div>` : `
      <div style="display:flex;align-items:center;gap:12px"><button class="iconbtn" data-act="lVoltar" aria-label="Voltar">${ic("back")}</button>${av(u.nome,36)}<div><b>${esc(u.nome)}</b><div class="muted" style="font-size:12.5px">Digite seu PIN de 4 números</div></div></div>
      <div class="pin-dots" aria-label="PIN digitado: ${L.pin.length} de 4">${[0,1,2,3].map(n => `<i class="${n < L.pin.length ? "f" : ""}"></i>`).join("")}</div>
      ${L.erro ? `<div class="err" style="text-align:center" role="alert">${esc(L.erro)}</div>` : ""}
      <div class="pad-grid">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-act="lDig" data-v="${n}">${n}</button>`).join("")}<button class="ghost" data-act="lVoltar">Voltar</button><button data-act="lDig" data-v="0">0</button><button class="ghost" data-act="lApaga">Apagar</button></div>`}
  </div></div>`;
}
async function lDig(v){
  if(L.pin.length >= 4) return; L.pin += v; L.erro = ""; render();
  if(L.pin.length === 4){
    try { const u = await API.entrar(L.u, L.pin); S.sessao = { ...u, pin: L.pin }; store.sset("estoque_sessao", S.sessao); L = { u: null, pin: "", erro: "" }; tocar(); location.hash = "#hoje"; render(); }
    catch(e){ L.pin = ""; L.erro = e.message; render(); }
  }
}

/* =====================================================================
   Renderização e eventos
   ===================================================================== */
const VIEWS = { hoje: vHoje, itens: vItens, movimentacoes: vMovs, validades: vValidades, compras: vCompras, backup: vBackup, auditoria: vAuditoria, usuarios: vUsuarios };
const PARTS = { itens: listaItens, movimentacoes: listaMovs, auditoria: listaAud };
function render(){
  if(!S.sessao){ $("#root").innerHTML = vLogin(); return; }
  const r = location.hash.slice(1); S.rota = VIEWS[r] ? r : "hoje";
  if(S.rotaAnt !== S.rota){ S.f = {}; S.rotaAnt = S.rota; }
  const y = window.scrollY;
  $("#root").innerHTML = shell(); $("#view").innerHTML = VIEWS[S.rota]();
  window.scrollTo(0, y);
}
function toast(msg, ruim){ const t = $("#toast"); t.innerHTML = `<div class="toast ${ruim ? "bad" : ""}" role="status">${ic(ruim ? "alert" : "check",18)}<span>${esc(msg)}</span></div>`; clearTimeout(toast.t); toast.t = setTimeout(() => t.innerHTML = "", ruim ? 7000 : 3800); }
function sair(){ S.sessao = null; store.sdel("estoque_sessao"); fechar(); L = { u: null, pin: "", erro: "" }; render(); }
let ultimoToque = Date.now(); const tocar = () => ultimoToque = Date.now();

const ACT = {
  fechar: () => fechar(), sair, recarregar: async () => { S.erroCarga = null; await carregar(); render(); },
  novaMov: (d) => novaMov({ tipo: d.tipo, it: d.it, lote: d.lote }),
  mTipo: (d) => { guardarCampos(); M.tipo = d.v; M.erro = ""; confirmarSemValidade = false; M.lote_id = M.item_id ? loteSugerido() : null; renderMov(); },
  mItem: (d) => { guardarCampos(); M.item_id = d.id; M.lote_id = loteSugerido(); M.erro = ""; renderMov(); },
  mTroca: () => { guardarCampos(); M.item_id = null; M.lote_id = null; renderMov(); },
  mLote: (d) => { guardarCampos(); M.lote_id = d.id; M.erro = ""; renderMov(); },
  mSalvar: (d, el) => salvarMov(el),
  editItem: (d) => editItem(d.id), salvarItem: (d, el) => salvarItem(d.id, el),
  editUser: (d) => editUser(d.id), salvarUser: (d, el) => salvarUser(d.id, el),
  lUser: (d) => { L = { u: d.id, pin: "", erro: "" }; render(); }, lVoltar: () => { L = { u: null, pin: "", erro: "" }; render(); },
  lDig: (d) => lDig(d.v), lApaga: () => { L.pin = L.pin.slice(0, -1); render(); },
  consultaOffline: () => { S.sessao = { id: null, nome: "Consulta offline", papel: "funcionaria", pin: "" }; render(); },
  exportItens: () => baixarXlsx(`itens-${hojeISO()}.xlsx`, [{ nome: "Itens", linhas: itensFiltrados().map(linhaItem) }]),
  exportMovs: () => baixarXlsx(`movimentacoes-${hojeISO()}.xlsx`, [{ nome: "Movimentações", linhas: movsFiltradas().map(linhaMov) }]),
  exportVal: () => baixarXlsx(`validades-${hojeISO()}.xlsx`, [{ nome: "Validades", linhas: linhaVal() }]),
  exportCompras: () => baixarXlsx(`lista-de-compras-${hojeISO()}.xlsx`, [{ nome: "Lista de compras", linhas: compras().map(({i,sug}) => ({ "Item": i.nome, "Descrição": i.descricao || "", "Fornecedor": i.fornecedor || "", "Cód. fornecedor": i.cod_fornecedor || "", "Saldo": i.saldo, "Mínimo": i.min, "Comprar": sug, "Unidade": i.unidade || "", "Custo estimado": Math.round(sug * Number(i.custo_unit || 0) * 100) / 100 })) }]),
  exportAud: () => baixarXlsx(`auditoria-${hojeISO()}.xlsx`, [{ nome: "Auditoria", linhas: S.audit.map(a => ({ "Data e hora": fDH(a.criado_em), "Quem": a.usuario_nome || "sistema", "Ação": ACAO[a.acao][0], "Tabela": TAB[a.tabela] || a.tabela, "Antes": JSON.stringify(a.antes || ""), "Depois": JSON.stringify(a.depois || "") })) }]),
  copiarCompras: async () => { const txt = `*Lista de compras · ${CLINICA} · ${new Date().toLocaleDateString("pt-BR")}*\n` + compras().map(({i,sug}) => `• ${i.nome}: ${fNum(sug)} ${low(i.unidade)}${i.fornecedor ? " (" + i.fornecedor + ")" : ""}`).join("\n"); try { await navigator.clipboard.writeText(txt); toast("Lista copiada. Cole no WhatsApp."); } catch(e){ toast("Não consegui copiar automaticamente neste navegador.", true); } },
  backup: (d, el) => backupCompleto(el), contingencia: () => contingencia(), importar: () => importar(), impConfirmar: (d, el) => impConfirmar(el),
  resetDemo: async () => { if(API.resetar){ API.resetar(); await carregar(); render(); toast("Dados da planilha restaurados."); } }
};

document.addEventListener("click", e => {
  tocar();
  const a = e.target.closest("[data-act]");
  if(a && !a.disabled){ e.preventDefault(); ACT[a.dataset.act] && ACT[a.dataset.act](a.dataset, a, e); return; }
  const go = e.target.closest("[data-go]"); if(go){ location.hash = "#" + go.dataset.go; return; }
  const it = e.target.closest("[data-item]"); if(it){ $("#gres") && ($("#gres").innerHTML = ""); abrirItem(it.dataset.item); return; }
  if(e.target.matches("[data-ov]")) fechar();
  if(!e.target.closest(".search") && $("#gres")) $("#gres").innerHTML = "";
});
document.addEventListener("input", e => {
  tocar();
  const t = e.target;
  if(t.dataset.f){ S.f[t.dataset.f] = t.value; const el = $("#lista"); if(el && PARTS[S.rota]) el.innerHTML = PARTS[S.rota](); return; }
  if(t.id === "m_busca"){ M.busca = t.value; const q = norm(t.value); const xs = D.itens.filter(x => !q || norm([x.nome, x.descricao, x.cod_fornecedor, x.codigo, ...x.lotes.map(l => l.lote)].join(" ")).includes(q)).slice(0, 30);
    $("#m_plist").innerHTML = xs.map(x => `<button data-act="mItem" data-id="${x.id}">${av(x.categoria, 30)}<span><b>${esc(x.nome)}</b><br><small class="muted">${esc(x.local || "")} · ${fNum(x.saldo)} ${esc(low(x.unidade))}</small></span><span class="sp"></span><span class="pill ${ST[x.st][0]}">${ST[x.st][1]}</span></button>`).join("") || `<div class="empty">Nenhum item encontrado.</div>`; return; }
  if(t.id === "gsearch"){ const q = norm(t.value); const box = $("#gres"); if(!q){ box.innerHTML = ""; return; }
    const xs = D.itens.filter(x => norm([x.nome, x.descricao, x.cod_fornecedor, x.codigo, x.fornecedor, ...x.lotes.map(l => l.lote)].join(" ")).includes(q)).slice(0, 8);
    box.innerHTML = `<div class="sresults">${xs.map(x => `<button data-item="${x.id}">${av(x.categoria, 28)}<span><b>${esc(x.nome)}</b><br><small class="muted">${fNum(x.saldo)} ${esc(low(x.unidade))} · ${esc(x.local || "")}</small></span></button>`).join("") || `<div class="empty">Nada encontrado.</div>`}</div>`; }
});
document.addEventListener("keydown", e => {
  tocar();
  if(e.key === "Escape" && $("#modal").innerHTML) fechar();
  if(e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName) && $("#gsearch")){ e.preventDefault(); $("#gsearch").focus(); }
  if(!S.sessao && L.u && /^[0-9]$/.test(e.key)) lDig(e.key);
  if(!S.sessao && L.u && e.key === "Backspace"){ L.pin = L.pin.slice(0, -1); render(); }
  if(e.key === "Enter" && M && e.target.id !== "m_busca" && $("#modal [data-act=mSalvar]")){ e.preventDefault(); salvarMov($("#modal [data-act=mSalvar]")); }
});
window.addEventListener("hashchange", () => { fechar(); render(); window.scrollTo(0, 0); });

/* relógio, sessão inativa (30 min) e atualização automática a cada 60 s */
setInterval(() => {
  const c = $("#clock"); if(c) c.textContent = "· " + fHora(Date.now());
  if(S.sessao && Date.now() - ultimoToque > 30 * 60e3){ sair(); toast("Sessão encerrada por inatividade."); }
}, 15e3);
if(ONLINE) setInterval(async () => { if(S.sessao && !$("#modal").innerHTML && document.visibilityState === "visible"){ await carregar(true); render(); } }, 60e3);
if(ONLINE && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

(async () => { await carregar(); if(S.sessao && S.sessao.id && !S.usuarios.some(u => u.id === S.sessao.id && u.ativo)) S.sessao = null; render(); })();
</script>
</body>
</html>
